# ========================================================
# RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# Auto-deploys the Node.js API backend and React Vite static site
# ========================================================

services:
  # 1. API Backend Web Service
  - type: web
    name: land-registry-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RPC_URL
        value: https://rpc.sepolia.org
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false

  # 2. React Vite Frontend Static Site
  - type: static
    name: land-registry-frontend
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: land-registry-backend
          property: host
